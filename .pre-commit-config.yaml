minimum_pre_commit_version: '4.5.1'
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: private-index
        name: Private paths and clean notebooks (complete Git index)
        entry: python scripts/checks/check_index.py
        language: python
        pass_filenames: false
        always_run: true
      - id: detect-secrets
        name: Detect secrets (offline, reviewed exact exceptions)
        entry: detect-secrets-hook
        language: python
        additional_dependencies: ['detect-secrets==1.5.0']
        args: [--baseline, .secrets.baseline, --no-verify, --json]
        types: [text]
      - id: ruff-critical
        name: Ruff critical errors
        entry: ruff check --config config/ruff-guardrails.toml
        language: python
        additional_dependencies: ['ruff==0.16.10']
        types: [python]
