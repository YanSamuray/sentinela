name: Quality and privacy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: '0.9.17'
          enable-cache: false
      - name: Install locked project environment
        run: uv sync --locked
      - name: Check all tracked files
        run: |
          uv tool install pre-commit==4.5.1
          pre-commit run --all-files
      - name: Test synthetic contracts and complete case
        # Includes the existing end-to-end synthetic case; do not run it twice.
        run: uv run --locked python -m pytest tests -q -p no:cacheprovider
      - name: Ensure checks did not modify tracked files
        run: git diff --exit-code
